name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      # Важно: сначала ставим pnpm, потом убеждаемся, что он в PATH
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12.6.0"
          run-install: false  # не запускаем install здесь, мы делаем это через make

      # Дополнительная страховка: проверяем, что pnpm виден
      - name: Verify pnpm is available
        run: pnpm --version

      - name:
