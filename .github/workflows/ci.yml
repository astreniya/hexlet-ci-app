name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      # Ставим последнюю стабильную версию pnpm (без жёсткой привязки)
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          run-install: false

      # Явно добавляем pnpm в PATH (страховка для GitHub Actions)
      - name: Add pnpm to PATH
        run: |
          echo "$HOME/pnpm" >> $GITHUB_PATH
          mkdir -p "$HOME/pnpm"
          # Если pnpm уже установлен в другом месте — находим и добавляем
          if command -v pnpm >/dev/null 2>&1; then
            PNPM_BIN=$(which pnpm)
            PNPM_DIR=$(dirname "$PNPM_BIN")
            echo "$PNPM_DIR" >> $GITHUB_PATH
          fi

      - name: Verify pnpm is available
        run: pnpm --version

      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test
